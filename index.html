<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookle</title>
<meta name="description" content="A cozy shelving puzzle. Every book has a wish. Make them all happy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4e6cf; --bg2:#ead4b4; --wall:#f9efdf; --wallLine:#efdcc1;
  --wood:#a86f43; --woodHi:#c48a58; --woodDk:#6e4426; --slot:#7a4c2d;
  --ink:#3a2a48; --muted:#7d6a72; --card:#fffaf2; --cardLine:#ecd9bd;
  --accent:#7b5cff; --accentHi:#9a82ff; --good:#ff5f8f;
  --sun:rgba(255,214,102,.28); --quiet:rgba(70,40,90,.16); --shadow:0 6px 18px rgba(80,50,30,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1729; --bg2:#271f37; --wall:#2a2240; --wallLine:#332a4c;
    --wood:#7b5236; --woodHi:#946545; --woodDk:#4a2f1d; --slot:#3a2618;
    --ink:#f3e9ff; --muted:#b4a6c4; --card:#2f2645; --cardLine:#43385f;
    --accent:#a58cff; --accentHi:#bfaeff; --sun:rgba(255,214,102,.14); --quiet:rgba(0,0,0,.25); --shadow:0 6px 18px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1729; --bg2:#271f37; --wall:#2a2240; --wallLine:#332a4c;
  --wood:#7b5236; --woodHi:#946545; --woodDk:#4a2f1d; --slot:#3a2618;
  --ink:#f3e9ff; --muted:#b4a6c4; --card:#2f2645; --cardLine:#43385f;
  --accent:#a58cff; --accentHi:#bfaeff; --sun:rgba(255,214,102,.14); --quiet:rgba(0,0,0,.25); --shadow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);
  font-family:Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:10px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:30px;font-weight:700;letter-spacing:-.5px;cursor:pointer;display:flex;align-items:center;background:none;border:0;padding:0}
.logo span{color:var(--accent)}
.logo i{font-style:normal;display:inline-block;margin-right:5px;animation:bob 2.4s ease-in-out infinite}
.hud{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.chip{background:var(--card);border:2px solid var(--cardLine);border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:12px;border:2px solid var(--cardLine);background:var(--card);font-size:17px;display:grid;place-items:center;padding:0;transition:transform .12s;position:relative}
.ib:active{transform:scale(.9)}
.ib.off{opacity:.45}
.ib .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--good);border:2px solid var(--card);display:none}
.ib .dot.on{display:block}
.ink-chip{color:var(--accent)}
.ink-chip.bump{animation:bump .4s}
.progress{position:relative;height:22px;border-radius:999px;background:var(--card);border:2px solid var(--cardLine);overflow:hidden}
#progFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff9cbc,var(--good));transition:width .4s cubic-bezier(.3,1.4,.6,1)}
#progTxt{position:relative;display:block;text-align:center;font-size:13px;font-weight:600;line-height:18px}

/* ---------- room ---------- */
.room{background:repeating-linear-gradient(90deg,var(--wall) 0 38px,var(--wallLine) 38px 40px);border-radius:20px;padding:10px 10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.room.party{animation:glow .91s ease-in-out infinite}
.room .discolights{display:none;position:absolute;inset:-50%;pointer-events:none;z-index:5;mix-blend-mode:overlay;
  background:conic-gradient(from 0deg,rgba(255,0,120,.45),rgba(0,200,255,.45),rgba(255,230,0,.45),rgba(120,255,80,.45),rgba(255,0,120,.45));animation:spin 3s linear infinite}
.room.party.disco .discolights{display:block}
.discoball{display:none;position:absolute;top:2px;left:50%;font-size:28px;z-index:6;animation:discoSpin 1.8s linear infinite;transform-origin:50% 0}
.room.party.disco .discoball{display:block}
.lights{display:none;position:absolute;left:0;right:0;top:0;height:16px;pointer-events:none}
.lights.on{display:flex;justify-content:space-around}
.lights b{width:7px;height:9px;border-radius:50%;margin-top:3px;animation:twinkle 1.8s infinite}
.party .lights b{animation-duration:.45s}
.colhead{display:grid;gap:4px;margin:6px 10px 4px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap}
.shelf{background:var(--woodDk);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;border:4px solid var(--wood)}
.row{display:grid;gap:4px;background:var(--slot);border-radius:6px;position:relative;box-shadow:inset 0 6px 10px rgba(0,0,0,.35)}
.row::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-6px;height:8px;background:linear-gradient(var(--woodHi),var(--wood));border-radius:3px;z-index:2}
.row.shine::before{content:"";position:absolute;inset:0;border-radius:6px;z-index:3;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,240,170,.75) 50%,transparent 70%);background-size:250% 100%;animation:sweep 1s ease-out forwards}
.slot{height:var(--slotH,92px);position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.slot+.slot{box-shadow:inset 1px 0 0 rgba(255,255,255,.05)}
.slot.sunny{background:linear-gradient(160deg,var(--sun),transparent 80%)}
.slot.quiet{background:linear-gradient(200deg,var(--quiet),transparent)}
.slot.hover{background:rgba(255,255,255,.18);outline:2px dashed rgba(255,255,255,.6);outline-offset:-3px}
.slot.target{outline:2px dashed rgba(255,255,255,.35);outline-offset:-3px}
.decor{font-size:min(32px,8vw);line-height:1;margin-bottom:4px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));cursor:pointer;transition:transform .2s;transform-origin:bottom center}
.decor.cat{animation:catbob 3s ease-in-out infinite}
.decor.lamp{filter:drop-shadow(0 0 10px rgba(255,220,120,.9))}
.decor.wanted{animation:wanted .8s ease-in-out infinite}
.party .decor{animation:dance .91s infinite}

/* ---------- books ---------- */
.book{--c:#ccc;position:relative;width:78%;max-width:46px;height:var(--h,80%);border-radius:7px 7px 3px 3px;transform-origin:bottom center;
  background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 22%,rgba(255,255,255,.22) 40%,transparent 60%,rgba(0,0,0,.14)),var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.3);cursor:grab;touch-action:none;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .2s;z-index:1;margin-bottom:2px}
.book::before,.book::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.45)}
.book::before{top:16%}.book::after{bottom:12%}
.book .wi{position:absolute;top:2px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10px;line-height:1.1;letter-spacing:-2px;pointer-events:none;z-index:2}
.book .face{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:26px;height:16px;pointer-events:none}
.book .eye{position:absolute;top:0;width:5px;height:6px;background:#2b1d2e;border-radius:50%;animation:blink 4s infinite}
.book .eye.l{left:4px}.book .eye.r{right:4px}
.cart .book .eye{animation:look 5s infinite}
.book .mouth{position:absolute;left:50%;top:9px;width:9px;height:5px;transform:translateX(-50%);border:2px solid #2b1d2e;border-top:0;border-radius:0 0 9px 9px}
.book.sad .mouth{top:11px;border:2px solid #2b1d2e;border-bottom:0;border-radius:9px 9px 0 0}
.book.sad .eye{height:5px;border-radius:50% 50% 40% 40%}
.book.wait .mouth{width:6px;height:2px;border:0;background:#2b1d2e;border-radius:2px;top:11px}
.book .blush{position:absolute;top:7px;width:5px;height:3px;border-radius:50%;background:rgba(255,80,120,.55);display:none}
.book.happy .blush{display:block}.book .blush.l{left:0}.book .blush.r{right:0}
.party .book.happy .eye,.tbooks .book .eye{background:none;border:2.5px solid #2b1d2e;border-bottom:0;border-radius:7px 7px 0 0;height:4px;width:7px;top:2px;animation:none}
.party .book.happy .eye.l,.tbooks .book .eye.l{left:3px}.party .book.happy .eye.r,.tbooks .book .eye.r{right:3px}
.party .book.happy .mouth,.tbooks .book .mouth{width:11px;height:7px;background:#2b1d2e;border:0;border-radius:1px 1px 11px 11px;top:8px;overflow:hidden}
.party .book.happy .mouth::after,.tbooks .book .mouth::after{content:"";position:absolute;bottom:-2px;left:2px;width:7px;height:4px;border-radius:50%;background:#ff7a9c}
.book .badge{position:absolute;top:-12px;right:-8px;font-size:15px;z-index:3;pointer-events:none;animation:pop .35s}
.book .cloud{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:20px;z-index:3;pointer-events:none;animation:cloud 2s ease-in-out infinite}
.book.legend{background:linear-gradient(90deg,rgba(0,0,0,.15),transparent 20%,rgba(255,255,255,.55) 45%,transparent 65%),linear-gradient(160deg,#ffe58a,#f5b623 60%,#ffd75e)}
.book.legend::after{background:rgba(255,255,255,.8)}
.book.legend .shim{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);background-size:300% 100%;animation:sweep 2.2s linear infinite;pointer-events:none}
/* idle bop, dance & one-shots (delays set inline to stay on the beat) */
.slot .book.happy{animation:bop 1.154s ease-in-out infinite}
.slot .book.happy.alt{animation-name:bop2}
.party .slot .book.happy{animation:dance .909s infinite}
.slot .book.sel,.book.sel{animation:none;transform:translateY(-8px) rotate(-3deg);filter:drop-shadow(0 0 6px var(--accentHi));z-index:4}
.slot .book.joy{animation:happyWiggle .55s !important;animation-delay:0s !important}
.book.shake{animation:shake .35s !important;animation-delay:0s !important}
.book.tremble{animation:tremble .08s 14 !important;animation-delay:0s !important}
.book.lean{animation:lean 1.6s ease-in-out !important;animation-delay:0s !important}
.book.shrink{animation:shrink 1.6s ease-in-out !important;animation-delay:0s !important}
.book.flip{animation:flip 1.5s ease-in-out !important;animation-delay:0s !important}
.book.jump{animation:jump .6s !important;animation-delay:0s !important}
.book.ghost{position:fixed;pointer-events:none;z-index:999;transform:rotate(6deg) scale(1.12);transition:none;width:44px;height:86px;animation:none}
.book.dragging{opacity:.25}

/* ---------- bubbles & floating text (live in the fixed fx layer) ---------- */
.bubble{position:absolute;background:var(--card);color:var(--ink);border:2px solid var(--cardLine);
  border-radius:12px;padding:5px 9px;font-size:12.5px;font-weight:500;width:max-content;max-width:190px;box-shadow:var(--shadow);animation:bubble 2.6s forwards;text-align:center;line-height:1.2}
.bubble::after{content:"";position:absolute;top:100%;left:var(--ax,50%);transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--cardLine)}
.bubble.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--cardLine)}
.bubble.mad{border-color:#ff9a7a}
.bubble.mad::after{border-top-color:#ff9a7a}
.bubble.mad.below::after{border-top-color:transparent;border-bottom-color:#ff9a7a}
.ftxt{position:absolute;font-weight:700;font-size:20px;white-space:nowrap;transform:translate(-50%,0);animation:ftxt 1.3s ease-out forwards;
  color:#fff;text-shadow:0 2px 0 var(--accent),0 -2px 0 var(--accent),2px 0 0 var(--accent),-2px 0 0 var(--accent),0 4px 8px rgba(0,0,0,.3)}
.ftxt.big{font-size:26px}
.ftxt.ink{text-shadow:0 2px 0 #3d8bff,0 -2px 0 #3d8bff,2px 0 0 #3d8bff,-2px 0 0 #3d8bff}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:800;pointer-events:none;font-size:clamp(34px,10vw,58px);font-weight:700;white-space:nowrap;
  color:#fff;text-shadow:0 3px 0 #ff5f8f,0 -3px 0 #ff5f8f,3px 0 0 #ff5f8f,-3px 0 0 #ff5f8f,0 8px 20px rgba(0,0,0,.35);animation:banner 2.6s cubic-bezier(.3,1.5,.5,1) forwards}
.banner small{display:block;text-align:center;font-size:.42em;text-shadow:0 2px 0 var(--accent),0 -2px 0 var(--accent),2px 0 0 var(--accent),-2px 0 0 var(--accent)}
.conf{position:absolute;top:-20px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}

/* ---------- cart ---------- */
.cartwrap{position:relative;padding-bottom:16px}
.cart{min-height:96px;background:linear-gradient(var(--woodHi),var(--wood));border-radius:14px;border:3px solid var(--woodDk);display:flex;align-items:flex-end;
  flex-wrap:wrap;justify-content:center;gap:10px 6px;padding:14px 10px 10px;box-shadow:var(--shadow)}
.cart .book{flex:0 0 40px;height:76px}
.cart.hover{outline:3px dashed var(--accent);outline-offset:2px}
.cart .empty{margin:auto;color:#fff6e6;font-weight:600;font-size:14px;opacity:.9;text-align:center;align-self:center}
.wheel{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:#3a2a20;border:4px solid #8c6b55}
.wheel.l{left:30px}.wheel.r{right:30px}
.cartlabel{position:absolute;top:-9px;left:14px;background:var(--card);border:2px solid var(--cardLine);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px;z-index:2}

/* ---------- panel ---------- */
.panel{background:var(--card);border:2px solid var(--cardLine);border-radius:18px;padding:12px 14px;min-height:118px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.panel .pb{flex:0 0 auto;position:relative;width:44px;height:90px;display:flex;align-items:flex-end}
.panel .pb .book{width:44px;max-width:none;height:90px;cursor:default}
.panel h3{margin:0 0 2px;font-size:17px;line-height:1.15}
.panel .meta{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--bg2);white-space:nowrap}
.quote{font-size:14px;margin:0 0 6px;font-style:italic;line-height:1.3}
.rule{font-size:12.5px;color:var(--muted);margin:2px 0;display:flex;gap:6px;align-items:baseline}
.rule b{color:var(--ink);font-weight:600}
.rule.ok b{color:var(--good)}
.tip{font-size:14px;line-height:1.4;color:var(--muted)}
.tip strong{color:var(--ink)}
.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(60,30,140,.45);transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,30,140,.45)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--cardLine);box-shadow:0 4px 0 var(--cardLine);flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pulse{animation:pulse 1.2s infinite}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,18,40,.55);display:grid;place-items:center;z-index:500;padding:16px;animation:fade .2s}
.overlay.hidden{display:none}
.card{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .35s cubic-bezier(.3,1.5,.5,1);position:relative}
.card h2{margin:0 0 8px;font-size:24px;text-align:center}
.card p{line-height:1.45}
.card .x{position:absolute;top:10px;right:10px}
.stars{font-size:38px;text-align:center;letter-spacing:4px;margin:4px 0}
.stars span{display:inline-block;animation:starpop .5s backwards}
.sumrow{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed var(--cardLine);font-size:15px}
.sumrow b{color:var(--accent)}
.shopitem{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--cardLine);border-radius:14px;margin-bottom:8px}
.shopitem .em{font-size:30px;width:40px;text-align:center}
.shopitem .tx{flex:1;font-size:13px;color:var(--muted);line-height:1.3}
.shopitem .tx b{display:block;color:var(--ink);font-size:15px}
.shopitem .btn{flex:0 0 auto;padding:8px 12px;font-size:14px}
.shopitem.owned{opacity:.6}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs button{flex:1;border:2px solid var(--cardLine);background:var(--bg2);border-radius:12px;padding:7px 4px;font-weight:600;font-size:13px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.dexg{margin:10px 0 4px;font-weight:600;display:flex;justify-content:space-between}
.dexl{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.dexl div{font-size:12px;padding:5px 7px;border-radius:8px;background:var(--bg2);line-height:1.2}
.dexl div.unk{opacity:.5;letter-spacing:2px}
.dexl div.gold{background:linear-gradient(120deg,#ffe58a,#f5c84a)!important;color:#5a3d00}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.coll{border:2px solid var(--cardLine);border-radius:14px;padding:8px 4px;text-align:center;font-size:11px;line-height:1.2;background:var(--bg2);position:relative}
.coll .e{font-size:28px;display:block;margin-bottom:3px}
.coll.unk{opacity:.4}.coll.unk .e{filter:grayscale(1) brightness(.4)}
.coll .n{position:absolute;top:3px;right:5px;font-weight:700;font-size:10px;color:var(--accent)}
.coll.rare{border-color:#6fb7ff}.coll.epic{border-color:#c48bff}.coll.legendary{border-color:#f5b623;background:linear-gradient(160deg,#fff4c4,var(--bg2))}
.reveal{text-align:center;margin:14px 0 4px;padding:12px;border-radius:16px;background:var(--bg2)}
.reveal .gift{font-size:52px;display:inline-block;animation:giftShake .9s}
.reveal .got{font-size:52px;display:inline-block;animation:pop .5s}
.share{white-space:pre;font-size:14px;background:var(--bg2);border-radius:12px;padding:10px;text-align:center;line-height:1.5;margin:8px 0}

/* title */
#title{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);background-color:var(--bg)}
#title.hidden{display:none}
.tcard{max-width:420px;width:100%;text-align:center}
.tlogo{font-size:64px;font-weight:700;letter-spacing:-2px;margin:0;line-height:1}
.tlogo span{color:var(--accent)}
.tsub{color:var(--muted);margin:6px 0 18px;font-size:16px}
.tbooks{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:100px;margin:10px 0 18px}
.tbooks .book{flex:0 0 40px;cursor:pointer;animation:dance .909s infinite}
.tbtn{display:block;width:100%;margin:10px 0;text-align:left;padding:14px 16px}
.tbtn small{display:block;font-weight:400;font-size:13px;opacity:.85}
.tfoot{margin-top:14px;font-size:13px;color:var(--muted)}

#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card);border:2px solid var(--cardLine);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:var(--shadow);animation:toast 4.2s forwards;line-height:1.3}
.toast.stk{border-color:#f5b623}
#fx{position:fixed;inset:0;pointer-events:none;z-index:700;overflow:hidden}
.p{position:absolute;font-size:18px;animation:fly 1s ease-out forwards}

@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes look{0%,40%{transform:translateX(0)}45%,60%{transform:translateX(-1.5px)}65%,80%{transform:translateX(1.5px)}85%,100%{transform:translateX(0)}93%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes bop2{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes dance{0%{transform:none}18%{transform:scale(1.08,.86)}42%{transform:translateY(-14px) rotate(-9deg) scale(.96,1.06)}62%{transform:scale(1.06,.9)}82%{transform:translateY(-6px) rotate(7deg)}100%{transform:none}}

  }catch(e){AC=null}}
  if(AC&&AC.state==='suspended'&&!document.hidden)AC.resume();

function osc(bus,f,t0,dur,type,vol,f2){
  const a=AC;if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(bus);o.start(t);o.stop(t+dur+.03);
}

  if(!ac())return;if(bus!==MUSBUS&&!P.sound)return;const a=AC,t=a.currentTime+Math.max(0,t0);
  const s=a.createBufferSource();s.buffer=NOISE;const f=a.createBiquadFilter();f.type=ftype||'bandpass';f.frequency.value=freq||2000;
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(bus||SFXBUS);s.start(t);s.stop(t+dur+.02);
}

const MUS={timer:null,next:0,step:0,party:false,phrase:null};
const PROG=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
const mf=n=>440*Math.pow(2,(n-69)/12);
function genPhrase(){const ph=[];for(let bar=0;bar<4;bar++){const ch=PROG[bar];for(let s=0;s<8;s++){const r=Math.random();ph.push(r<(s%2?.32:.72)?ch[Math.floor(Math.random()*3)]+12+(Math.random()<.25?12:0):null)}}return ph}
function voice(n,t,dur,type,vol){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(mf(n),t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MUSBUS);o.start(t);o.stop(t+dur+.03)}
function schedStep(step,t){
  const bar=Math.floor(step/8)%4,s=step%8,ch=PROG[bar],pt=MUS.party;
  if(s===0)voice(ch[0]-24,t,.4,'triangle',.22);
  if(s===4)voice(ch[0]-17,t,.35,'triangle',.18);
  if(pt&&(s===3||s===7))voice(ch[0]-12,t,.18,'triangle',.12);
  if(s===2||s===6)ch.forEach((n,i)=>voice(n,t+i*.012,.2,'triangle',.045));
  const m=MUS.phrase[step%32];if(m!=null){voice(m,t,.28,'sine',.08);voice(m+12,t,.12,'sine',.015)}
  if(pt){const t0=t-AC.currentTime;noise(t0,.04,.05,'highpass',8000,MUSBUS);if(s===2||s===6)noise(t0,.12,.14,'bandpass',1500,MUSBUS);if(s===0||s===4)voice(36,t,.15,'sine',.3)}
}
function musicStart(){
  if(!P.music||MUS.timer||!ac())return;
  if(!MUS.phrase)MUS.phrase=genPhrase();
  MUS.next=AC.currentTime+.1;
  MUS.timer=setInterval(()=>{
    if(!AC)return;
    if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
    while(MUS.next<AC.currentTime+.15){
      schedStep(MUS.step,MUS.next);MUS.next+=60/(MUS.party?132:104)/2;MUS.step++;
      if(MUS.step%64===0)MUS.phrase=genPhrase();
    }
  },25);
}

let S=null;
function ctx(b,idx,w){
  const r=Math.floor(idx/S.cols),c=idx%S.cols,g=S.grid;
  return {b,w,r,c,rows:S.rows,cols:S.cols,
    L:c>0?g[idx-1]:null, R:c<S.cols-1?g[idx+1]:null, B:r<S.rows-1?g[idx+S.cols]:null, A:r>0?g[idx-S.cols]:null,
    row:g.slice(r*S.cols,r*S.cols+S.cols)};
}
const wishOk=(b,idx,w)=>WISH[w.type].ok(ctx(b,idx,w));
const isHappy=b=>b.pos>=0&&b.wishes.every(w=>wishOk(b,b.pos,w));
// evaluate b as if it were at idx (occupant swaps into b's old spot)
function hypothetical(b,idx,fn){
  const from=b.pos, occ=S.grid[idx];
  if(from>=0)S.grid[from]=null;
  if(isB(occ)&&from>=0)S.grid[from]=occ;
  S.grid[idx]=b;
  const res=fn();
  S.grid[idx]=occ; if(from>=0)S.grid[from]=b;
  return res;
}
const fill=(t,b,w)=>t.replace(/\{G\}/g,w&&w.g?G(w.g).name:'').replace(/\{S\}/g,G(b.genre).name).replace(/\{D\}/g,w&&w.d?DECOR[w.d].name:'');

/* ---------- generator: build a solved full shelf, then derive wishes from it ---------- */
function generate(cfg,rng){
  const {rows,cols,decor,genres,legend,two,diff}=cfg;
  const total=rows*cols;
  S={rows,cols,grid:Array(total).fill(null),books:[],cart:[],moves:0,hints:0,sel:null,mode:cfg.mode,num:cfg.num,
     catDone:false,done:false,wasAll:false,party:false,combo:0,maxCombo:0,rowDone:{},rowAward:{},rowBonus:0,petted:false,lastDrama:-1};
  const order=shuffle([...Array(total).keys()],rng);
  decor.forEach(k=>{S.grid[order.pop()]={t:'decor',kind:k}});
  const free=order,n=free.length;
  const used=new Set(),dex=new Set(P.dex);
  for(let i=0;i<n;i++){
    const g=pick(genres,rng);
    let pool=G(g).titles.filter(t=>!used.has(t));
    if(!pool.length)pool=G(g).titles;
    if(cfg.mode==='lib'){const fresh=pool.filter(t=>!dex.has(t));if(fresh.length&&rng()<.65)pool=fresh}
    const title=pick(pool,rng);used.add(title);
    S.books.push({t:'book',id:i,genre:g,title,wishes:[],legend:rng()<legend,h:64+Math.floor(rng()*25),pos:-1,happy:false,sadSince:0,gloomy:false});
  }
  S.books.forEach((b,i)=>{b.pos=free[i];S.grid[free[i]]=b});
  const inPlay=[...new Set(S.books.map(b=>b.genre))];
  const slots=[...Array(total).keys()].filter(i=>!(S.grid[i]&&S.grid[i].t==='decor'));
  const usedT={};
  shuffle([...S.books],rng).forEach(b=>{
    const cands=[];
    ['window','corner','top','bottom','edge','alone','social','same','rowOnly','bookends'].forEach(t=>cands.push({type:t}));
    if(rows>=3)cands.push({type:'middle'});
    inPlay.forEach(g=>{
      if(g!==b.genre){cands.push({type:'like',g});cands.push({type:'rowWith',g})}
      if(S.books.some(o=>o!==b&&o.genre===g))cands.push({type:'dislike',g});
      cands.push({type:'above',g});cands.push({type:'below',g});cands.push({type:'leftOf',g});
    });
    decor.forEach(d=>cands.push({type:'near',d}));
    if(decor.includes('cat'))cands.push({type:'nocat'});
    const sat=cands.filter(w=>wishOk(b,b.pos,w));
    const weights=sat.map(w=>{
      let cnt=0;slots.forEach(j=>{if(hypothetical(b,j,()=>wishOk(b,j,w)))cnt++});
      return TYPEW[w.type]*Math.pow(1/Math.max(1,cnt),diff)/(1+(usedT[w.type]||0)*.9);
    });
    const want=1+(rng()<two?1:0)+(b.legend?1:0);
    let pool=sat.slice(),pw=weights.slice();
    while(b.wishes.length<want&&pool.length){
      const w=wpick(pool,pw,rng);b.wishes.push(w);usedT[w.type]=(usedT[w.type]||0)+1;
      const keep=pool.map((x,i)=>x.type!==w.type?i:-1).filter(i=>i>=0);pool=keep.map(i=>pool[i]);pw=keep.map(i=>pw[i]);
    }
    if(b.legend&&b.wishes.length<2)b.legend=false;
    b.line=b.wishes.map((w,i)=>{const L=WISH[w.type].lines,l=fill(pick(Array.isArray(L)?L:L[w.d],rng),b,w);return i===0?l:(i===1?' Also, ':' AND ')+l.replace(/^./,c=>c.toLowerCase())}).join('');
  });
  S.sol={};S.books.forEach(b=>{S.sol[b.id]=b.pos;S.grid[b.pos]=null;b.pos=-1});
  S.cart=shuffle(S.books.map(b=>b.id),rng);
}

function burst(x,y,emojis,n){
  const fx=$('#fx');
  for(let i=0;i<n;i++){
    const p=document.createElement('span');p.className='p';p.textContent=pick(emojis);
    const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
    p.style.left=x+'px';p.style.top=y+'px';
    p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(Math.sin(a)*d-40)+'px');p.style.setProperty('--rot',(Math.random()*120-60)+'deg');
    p.style.animationDuration=(.7+Math.random()*.6)+'s';
    fx.appendChild(p);setTimeout(()=>p.remove(),1400);
  }
}
function ftxt(x,y,text,cls){const t=document.createElement('div');t.className='ftxt '+(cls||'');t.textContent=text;t.style.left=Math.max(80,Math.min(innerWidth-80,x))+'px';t.style.top=y+'px';$('#fx').appendChild(t);setTimeout(()=>t.remove(),1400)}

const GENERIC_HAPPY=["Ahh, perfect.","Ooh!","*happy page flutter*","This is the one.","I could live here.","10/10 shelf.","*purrs in paper*","Finally, someone who listens."];
const GENERIC_SAD=["Hmph.","Excuse me?","This is NOT what I asked for.","*passive-aggressive rustle*","I'll write a strongly-worded footnote.","Did you even READ my blurb?"];
function evalAll(){
  const now=Date.now(),before={};
  S.books.forEach(b=>{before[b.id]=b.happy;b.happy=isHappy(b);
    if(b.happy||b.pos<0){b.sadSince=0;b.gloomy=false}
    else if(before[b.id]||!b.sadSince){b.sadSince=now;b.gloomy=false}});
  return before;
}
function place(id,idx){
  const b=S.books[id],cell=S.grid[idx];
  if(cell&&cell.t==='decor'){SFX.nope();if(cell.kind==='cat')toast('🐈 The cat refuses to move. It was here first.',2400);render();return}
  if(b.pos===idx){S.sel=null;render();return}
  const from=b.pos;
  if(isB(cell)){
    cell.sadSince=0;
    if(from>=0){S.grid[from]=cell;cell.pos=from}
    else{cell.pos=-1;S.cart.splice(S.cart.indexOf(id),1,cell.id)}
    SFX.swap();
  } else {if(from<0)S.cart.splice(S.cart.indexOf(id),1);else S.grid[from]=null;SFX.place()}
  S.grid[idx]=b;b.pos=idx;b.sadSince=0;S.moves++;S.sel=null;
  afterMove(b);
}
function toCart(id){
  const b=S.books[id];if(b.pos<0)return;
  S.grid[b.pos]=null;b.pos=-1;S.cart.push(id);S.moves++;S.sel=null;SFX.place();S.combo=0;
  afterMove(null);
}
function afterMove(b){
  const before=evalAll();
  let upset=0;S.books.forEach(o=>{if(o!==b&&o.pos>=0&&before[o.id]&&!o.happy)upset++});
  if(b){if(S.hinting)S.combo=0;else if(b.happy&&!upset){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo)}else S.combo=0}
  render();
  if(b){
    const r=rectOf(b.id);
    if(b.happy){
      SFX.happy(S.combo);
      say(b.id,pick(G(b.genre).happy.concat(GENERIC_HAPPY)));
      if(r){burst(r.left+r.width/2,r.top,['💖','✨','💕','⭐'],b.legend?14:6+Math.min(S.combo,8));
        if(S.combo>=2)setTimeout(()=>ftxt(r.left+r.width/2,r.top-30,`${COMBO_WORDS[Math.min(S.combo,8)]} ×${S.combo}`,S.combo>=5?'big':''),200)}
      animBook(b.id,'joy',600);
      sticker('smile');
      if(S.combo>=5)sticker('combo5');if(S.combo>=8)sticker('combo8');
      if(b.legend){sticker('legend');if(!P.gold.includes(b.title)){P.gold.push(b.title);saveP();checkCollStickers();setTimeout(()=>toast(`🌟 <b>Golden edition</b> of <i>${esc(b.title)}</i> added to your Bookdex!`,3600),900)}}
    } else {
      SFX.grump();say(b.id,pick(G(b.genre).sad.concat(GENERIC_SAD)),false,true);animBook(b.id,'shake',400);
    }
  }
  // ripple reactions on neighbors whose mood changed
  let rip=0;
  S.books.forEach(o=>{
    if(o===b||o.pos<0||before[o.id]===o.happy)return;
    const r=rectOf(o.id);if(!r)return;rip++;
    if(o.happy){burst(r.left+r.width/2,r.top,['💖','✨'],4);animBook(o.id,'joy',600)}
    else{burst(r.left+r.width/2,r.top,['💢'],2);animBook(o.id,'shake',400);if(rip===1)setTimeout(()=>say(o.id,pick(["Hey! I was comfy!","Ugh, new neighbor.","Who invited THEM?","I liked it before.","Rude.","Excuse me, I was HAPPY."]),true,true),b?800:0)}
  });
  if(rip&&b)setTimeout(SFX.ripple,180);
  checkRows();
  checkState();
}
function checkRows(){

function drama(b,tantrum){

    if(nb){const d=pick(ROWFIGHT);say(b.id,fill(d[0],b,w),false,true);animBook(b.id,'shake',400);setTimeout(()=>{say(nb.id,fill(d[1],b,w),true,true);animBook(nb.id,'shake',400)},1400);sticker('argue');return}}
  if(w.type==='nocat'){say(b.id,'Aaa... aaa...',false,true);SFX.sneeze();

      else if(t==='cart')cartEl.classList.add('hover');

  if(dc){
    const r=dc.getBoundingClientRect(),k=dc.dataset.decor;
    if(k==='cat'){SFX.purr();burst(r.left+r.width/2,r.top,['💗','💤','🐾'],6);if(stat('pets')>=10)sticker('pet10');saveP();
      if(S.mode==='lib'&&!S.petted){S.petted=true;P.ink+=1;saveP();renderHud();bumpInk();toast('🐈 Purrrr. The cat gives you 1 💧 (it found it under the sofa).',3000)}
      else toast(pick(['🐈 Purrrrr.','🐈 The cat allows this.','🐈 *slow blink*','🐈 Mrrp?','🐈 The cat is judging your shelving. Lovingly.']),2200)}
    else if(k==='teacup'){tone(1400,0,.15,'sine',.05);tone(1800,.08,.2,'sine',.04);toast(pick(['🍵 Still warm. Somehow always warm.','🍵 The tea is chamomile. The tea is always chamomile.','🍵 Please do not spill on the Cookbooks.']),2200)}
    else if(k==='snacks'){noise(0,.08,.15,'bandpass',2500);tone(600,.1,.1,'triangle',.08);toast(pick(['🍪 *crunch* You ate one. The books saw.','🍪 Library rule #1: no snacks. Library rule #2: see rule #1, but quietly.','🍪 The snack jar is half full. Optimist!']),2200)}
    else if(k==='lamp'){tone(900,0,.05,'square',.04);dc.style.filter='grayscale(1) brightness(.6)';setTimeout(()=>{dc.style.filter='';tone(1200,0,.05,'square',.04)},600)}
    else if(k==='fern'){noise(0,.3,.08,'bandpass',4000);toast(pick(['🪴 The fern rustles approvingly.','🪴 The fern is thriving. Unlike your houseplants.','🪴 Its name is Gerald.']),2200)}
    dc.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-8deg)'},{transform:'scale(1)'}],{duration:350});
    return;
  }
  const slot=e.target.closest('.slot');
  if(slot&&S.sel!=null&&!e.target.closest('.book')){const c=S.grid[+slot.dataset.idx];if(!c)place(S.sel,+slot.dataset.idx)}
});
$('.cartwrap').addEventListener('click',e=>{if(e.target.closest('.book'))return;if(S.sel!=null&&S.books[S.sel].pos>=0)toCart(S.sel)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(S&&S.sel!=null){S.sel=null;render()}}});

/* ================= hints ================= */
$('#hintBtn').addEventListener('click',()=>{
  if(S.done)return;
  if(S.mode==='lib'&&P.ink<5){SFX.nope();toast('💧 Not enough ink for a hint. The books suggest… reading them.');return}
  let cands=S.books.filter(b=>!b.happy&&b.pos!==S.sol[b.id]);
  if(!cands.length)cands=S.books.filter(b=>b.pos!==S.sol[b.id]);
  if(!cands.length){toast('💡 Everything is already where it should be!');return}
  cands.sort((a,b)=>(a.pos<0?0:1)-(b.pos<0?0:1));
  const b=cands[0],target=S.sol[b.id],occ=S.grid[target];
  if(S.mode==='lib'){P.ink-=5;saveP()}
  S.hints++;SFX.flutter();
  if(isB(occ)&&occ!==b){S.grid[target]=null;occ.pos=-1;S.cart.push(occ.id)}
  S.hinting=true;place(b.id,target);S.hinting=false;S.moves--;
  renderHud();
  toast(`💡 <i>${esc(b.title)}</i> whispers: "${pick(["I belong here. Trust me.","This spot. It's destiny.","Psst. Here."])}"`,2600);
});

/* ================= day flow ================= */
function startLib(){
  const prevSize=P.day>1?libSize(P.day-1).join('x'):null;
  generate(libCfg(),Math.random);
  $('#title').classList.add('hidden');MUS.party=false;render();unlockAudio();
  setTimeout(()=>toast(`📬 <i>${esc(pick(S.books).title)}</i> was returned ${pick(['3 weeks','11 days','a fortnight','6 months','one (1) leap year'])} late. Excuse: "${pick(EXCUSES)}"`,5200),500);
  const nG=libGenres(P.day);
  if(nG>P.gSeen){const news=GENRE_ORDER.slice(P.gSeen,nG).map(g=>`${G(g).emoji} ${G(g).name}`).join(', ');P.gSeen=nG;saveP();setTimeout(()=>toast(`🎉 <b>New genre in town:</b> ${news}! ${G(GENRE_ORDER[nG-1]).blurb}`,5200),1600)}
  if(prevSize&&prevSize!==libSize(P.day).join('x'))setTimeout(()=>toast(`📐 <b>The shelves grew!</b> More books, more wishes, more drama.`,4500),2700);
  if(P.day===3)setTimeout(()=>toast(`😤 Books are getting <b>pickier</b>. Some now have TWO wishes!`,4500),3800);
  if(P.day===4)setTimeout(()=>toast(`🌟 <b>Legendary</b> golden books can now appear. Extra wishes. Huge ink.`,4500),3800);
  if(P.day>=10)sticker('day10');
  if(!P.help){P.help=true;saveP();setTimeout(showHelp,300)}
}
function closeDay(){
  if(S.mode!=='lib'||S.cart.length)return;
  const happy=S.books.filter(b=>b.happy),n=S.books.length,perfect=happy.length===n;
  const mult=(owns('bookmark')?1.5:1)*(owns('lights')?1.15:1)*(owns('rug')?1.1:1)*(owns('disco')?1.2:1);
  const base=happy.reduce((a,b)=>a+1+b.wishes.length,0), leg=happy.filter(b=>b.legend).length*10;
  const bonus=perfect?Math.min(40,8+P.streak*4):0, rows=S.rowBonus;
  const total=Math.round((base+leg+bonus+rows)*mult);
  const newDex=happy.filter(b=>!P.dex.includes(b.title));
  newDex.forEach(b=>P.dex.push(b.title));
  P.ink+=total;P.happyTotal+=happy.length;P.streak=perfect?P.streak+1:0;P.best=Math.max(P.best,P.streak);if(perfect)P.perfects++;
  const pct=happy.length/n,stars=perfect?3:pct>=.75?2:pct>=.5?1:0;
  const dayWas=P.day;P.day++;
  let charm=null;if(perfect)charm=rollCharm();
  saveP();checkCollStickers();
  if(perfect){sticker('perfect');if(P.streak>=3)sticker('streak3');if(P.streak>=7)sticker('streak7');if(S.hints===0&&dayWas>=3)sticker('nohint')}
  SFX.coin();
  const grumps=S.books.filter(b=>!b.happy);
  openModal(`<h2>🌙 Day ${dayWas} complete</h2>
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.18}s;${i<stars?'':'filter:grayscale(1);opacity:.35'}">⭐</span>`).join('')}</div>
    <p style="text-align:center;margin:4px 0 12px">${perfect?pick(['A perfect day! The books are writing you a thank-you note.','Flawless. Several books cried. Happily.','Perfect! Even the Encyclopedia said "acceptable".']):grumps.length===1?`Almost! <i>${esc(grumps[0].title)}</i> is sulking. It'll get over it.`:`${grumps.length} books went to sleep grumpy. They're writing angry diary entries.`}</p>
    <div class="sumrow"><span>💖 Happy books (wishes granted)</span><b>+${base}</b></div>
    ${rows?`<div class="sumrow"><span>✨ Shelves completed</span><b>+${rows}</b></div>`:''}
    ${leg?`<div class="sumrow"><span>🌟 Legendary bonus</span><b>+${leg}</b></div>`:''}
    ${perfect?`<div class="sumrow"><span>⭐ Perfect Day${P.streak>1?` (streak ${P.streak})`:''}</span><b>+${bonus}</b></div>`:''}
    ${S.maxCombo>=3?`<div class="sumrow"><span>🔥 Best combo</span><b>×${S.maxCombo}</b></div>`:''}
    ${mult>1?`<div class="sumrow"><span>🔖 Ink multiplier</span><b>×${mult.toFixed(2)}</b></div>`:''}
    <div class="sumrow" style="font-size:18px"><span><b style="color:var(--ink)">Total</b></span><b id="inkCount">+0 💧</b></div>
    ${charm?revealHTML('rv'):''}
    ${newDex.length?`<p style="margin:12px 0 0">📖 <b>${newDex.length} new</b> in your Bookdex! (${P.dex.length}/${ALL_TITLES})</p>`:''}
    ${P.streak>=2?`<p style="margin:6px 0 0">🔥 Perfect streak: <b>${P.streak}</b>. Don't break it!</p>`:(!perfect&&P.best>=2?`<p style="margin:6px 0 0;color:var(--muted)">Streak reset. Best: ${P.best} 🔥</p>`:'')}
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn sec" id="mShop">🛍️ Shop</button><button class="btn" id="mNext">☀️ Open Day ${P.day}</button></div>`,false);
  for(let i=0;i<stars;i++)setTimeout(()=>SFX.star(i),180+i*180);
  const ic=$('#inkCount');let k=0;const steps=20;const iv=setInterval(()=>{k++;if(!document.body.contains(ic)){clearInterval(iv);return}ic.textContent=`+${Math.round(total*k/steps)} 💧`;SFX.tick();if(k>=steps){clearInterval(iv);SFX.coin();bumpInk();renderHud()}},40);
  if(charm)playReveal('rv',charm);
  $('#mNext').onclick=()=>{closeModal();startLib()};
  $('#mShop').onclick=()=>{openShop(true)};
}
$('#closeBtn').addEventListener('click',()=>{if(S.mode==='lib')closeDay();else if(S.done)showDailyResult()});

/* ---------- daily ---------- */
function startDaily(){
  const num=dailyNum();
  generate(dailyCfg(num),mulberry32(num*7919+1234567));
  $('#title').classList.add('hidden');MUS.party=false;render();unlockAudio();
  if(D.res[num]){S.replay=true;toast('☀️ You already solved today\'s Bookle. This is a practice replay!',3500)}
  if(!P.help){P.help=true;saveP();setTimeout(showHelp,300)}
}
function rankFor(moves,n,hints){
  if(hints===0&&moves<=n)return '🏆 Mind-Reader';
  if(hints===0&&moves<=n+5)return '🎩 Head Librarian';
  if(moves<=n+14&&hints<=1)return '📖 Bookworm';
  return '🐛 Enthusiastic Intern';
}
function finishDaily(){
  const num=S.num;let charm=null;
  if(!D.res[num]){
    D.res[num]={m:S.moves,h:S.hints,n:S.books.length};
    D.streak=(D.last===num-1)?D.streak+1:1;D.last=num;D.best=Math.max(D.best,D.streak);D.played++;saveD();
    S.books.forEach(b=>{if(!P.dex.includes(b.title))P.dex.push(b.title);if(b.legend&&!P.gold.includes(b.title))P.gold.push(b.title)});
    charm=rollCharm();saveP();
    sticker('daily1');if(D.streak>=3)sticker('daily3');if(S.hints===0&&S.moves<=S.books.length)sticker('mind');checkCollStickers();
  }
  render();showDailyResult(charm);
}
function shareText(num){
  const r=D.res[num];if(!r)return '';
  return `Bookle #${num} 📚\n${'💖'.repeat(r.n)}\n${r.n}/${r.n} happy · ${r.m} moves · ${r.h} hint${r.h===1?'':'s'}\n${rankFor(r.m,r.n,r.h)}`;
}
function showDailyResult(charm){
  const num=S.num,r=D.res[num];if(!r)return;
  const st=shareText(num);
  openModal(`<h2>☀️ Daily Bookle #${num}</h2>
    <p style="text-align:center;margin:0 0 6px">${pick(['Every single book is happy. You are a menace to grumpiness.','The books have formed a fan club. You are the president.','Shelved to perfection. The cat is impressed (it will never say so).'])}</p>
    <div class="share">${esc(st)}</div>
    ${charm?revealHTML('rv'):''}
    <div class="sumrow"><span>🔥 Daily streak</span><b>${D.streak}</b></div>
    <div class="sumrow"><span>🏅 Best streak</span><b>${D.best}</b></div>
    <div class="sumrow"><span>📅 Played</span><b>${D.played}</b></div>
    <p style="text-align:center;color:var(--muted);font-size:14px" id="cd"></p>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sec" id="mLib">🏛️ My Library</button><button class="btn" id="mShare">📤 Copy result</button></div>`);
  if(charm)playReveal('rv',charm);
  const cd=$('#cd');const tick=()=>{if(!document.body.contains(cd))return;const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n;const h=Math.floor(t/36e5),m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;cd.textContent=`Next Bookle in ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;setTimeout(tick,1000)};tick();
  $('#mShare').onclick=()=>copy(st);
  $('#mLib').onclick=()=>{closeModal();startLib()};
}
function copy(t){
  const done=()=>toast('📋 Copied! Go make your friends jealous.',2500);
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({text:t}).catch(()=>{});return}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
}

/* ================= modals ================= */
function openModal(html,closable=true){
  const c=$('#modalCard');c.innerHTML=(closable?'<button class="ib x" id="mX">✕</button>':'')+html;
  $('#modal').classList.remove('hidden');$('#modal').dataset.closable=closable?'1':'';
  if(closable)$('#mX').onclick=closeModal;
}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#modal').dataset.closable)closeModal()});
function showHelp(){
  openModal(`<h2>How to Bookle</h2>
  <p>📦 Books return on the cart. Each one has a <b>wish</b> (or two, or three). Tap a book to read it.</p>
  <p>🖐️ <b>Drag</b> books onto the shelves, or tap a book and then an empty slot. Drop one on another to <b>swap</b>.</p>
  <p>🧩 The shelves have <b>exactly</b> enough room, so every book matters. Moving one book can upset its neighbors!</p>
  <p>👀 "Next to" means directly <b>left or right</b>. 👇/👆 books care about the slot right below/above them.</p>
  <p>💖 = happy, 💢 = grumpy. Leave grumpy books too long and they get… dramatic.</p>
  <p>☀️ <b>Daily Bookle</b>: one puzzle a day, same for everyone.<br>🏛️ <b>My Library</b>: endless days, ink, upgrades, a cat. Collect ${ALL_TITLES} books, ${CHARMS.length} charms and ${STICKERS.length} stickers in your 🎒.</p>
  <button class="btn" style="width:100%;margin-top:6px" id="mOk">Let's shelve! 📚</button>`);
  $('#mOk').onclick=closeModal;
}
function openShop(fromSummary){
  const items=SHOP.map(it=>{
    const own=owns(it.id);
    return `<div class="shopitem ${own?'owned':''}"><div class="em">${it.emoji}</div><div class="tx"><b>${it.name}</b>${it.desc}</div>
      ${own?'<span class="tag">Owned ✓</span>':`<button class="btn" data-buy="${it.id}" ${P.ink<it.cost?'disabled':''}>${it.cost} 💧</button>`}</div>`}).join('');
  openModal(`<h2>🛍️ Cozy Shop</h2><p style="text-align:center;margin:0 0 12px">You have <b style="color:var(--accent)">${P.ink} 💧</b> ink. New decor arrives tomorrow.</p>${items}
    ${fromSummary?`<button class="btn" style="width:100%;margin-top:6px" id="mNext2">☀️ Open Day ${P.day}</button>`:''}`,!fromSummary);
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.buy);if(P.ink<it.cost)return;
    P.ink-=it.cost;P.owned.push(it.id);saveP();SFX.coin();SFX.sparkle();bumpInk();renderHud();
    const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,[it.emoji,'✨','💖'],10);
    toast(`${it.emoji} <b>${it.name}</b> ${pick(['delivered! The books are gossiping about it.','acquired! Very cozy.','is here! Everyone pretends not to be excited.'])}`);
    if(SHOP.filter(s=>owns(s.id)).length>=5)sticker('shop5');
    setTimeout(()=>openShop(fromSummary),250);
  });
  if(fromSummary)$('#mNext2').onclick=()=>{closeModal();startLib()};
}
function openDex(tab){
  tab=tab||'books';P.newColl=false;saveP();if(S)renderHud();
  const has=new Set(P.dex),gold=new Set(P.gold);
  let body='';
  if(tab==='books'){
    body=`<p style="text-align:center;margin:0">${P.dex.length} / ${ALL_TITLES} books · 🌟 ${P.gold.length} golden</p>`+GENRE_ORDER.map(g=>{const gg=G(g);const n=gg.titles.filter(t=>has.has(t)).length;
      return `<div class="dexg"><span>${gg.emoji} ${gg.name}</span><span style="color:var(--muted)">${n}/${gg.titles.length}${n===gg.titles.length?' 🏆':''}</span></div>
      <div class="dexl">${gg.titles.map(t=>has.has(t)?`<div class="${gold.has(t)?'gold':''}" style="background:${gg.color}40">${gold.has(t)?'🌟 ':''}${esc(t)}</div>`:'<div class="unk">???</div>').join('')}</div>`}).join('');
  } else if(tab==='charms'){
    const n=Object.keys(P.charms).length;
    body=`<p style="text-align:center;margin:0 0 10px">${n} / ${CHARMS.length} bookmark charms<br><span style="font-size:13px;color:var(--muted)">Drop from perfect Library days and solved Dailies.</span></p><div class="grid4">`+
      CHARMS.map(([id,e,name,rar])=>{const c=P.charms[id];return `<div class="coll ${rar} ${c?'':'unk'}">${c>1?`<span class="n">×${c}</span>`:''}<span class="e">${e}</span>${c?esc(name):'???'}</div>`}).join('')+'</div>';
  } else {
    const n=P.stickers.length;
    body=`<p style="text-align:center;margin:0 0 10px">${n} / ${STICKERS.length} stickers</p><div class="grid4">`+
      STICKERS.map(([id,e,name,desc])=>{const g=P.stickers.includes(id);return `<div class="coll ${g?'':'unk'}" title="${esc(desc)}"><span class="e">${e}</span><b>${esc(name)}</b><br><span style="color:var(--muted)">${esc(desc)}</span></div>`}).join('')+'</div>';
  }
  openModal(`<h2>🎒 Collection</h2>
    <div class="tabs"><button data-t="books" class="${tab==='books'?'on':''}">📖 Books</button><button data-t="charms" class="${tab==='charms'?'on':''}">🎀 Charms</button><button data-t="stickers" class="${tab==='stickers'?'on':''}">🏷️ Stickers</button></div>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 8px">Library day ${P.day} · ${P.perfects} perfect days · best streak ${P.best}🔥</p>${body}`);
  document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{SFX.pick();openDex(b.dataset.t)});
}
$('#helpBtn').onclick=showHelp;
$('#dexBtn').onclick=()=>openDex();
$('#shopBtn').onclick=()=>openShop(false);
$('#sndBtn').onclick=()=>{P.sound=!P.sound;saveP();renderHud();if(P.sound)SFX.pick()};
$('#musBtn').onclick=()=>{P.music=!P.music;saveP();if(P.music)musicStart();else musicStop();renderHud()};
$('#homeBtn').onclick=showTitle;

/* ================= title ================= */
function showTitle(){
  closeModal();MUS.party=false;
  const num=dailyNum();
  $('#dailySub').textContent=D.res[num]?`#${num} solved ✓ · streak ${D.streak}🔥 · tap to replay`:`#${num} · One puzzle a day. Same for everyone.`;
  $('#libSub').textContent=P.day>1?`Day ${P.day} · ${P.ink} 💧 · ${P.dex.length}/${ALL_TITLES} books · ${Object.keys(P.charms).length}/${CHARMS.length} charms`:'Endless days, ink, cozy upgrades, a cat.';
  $('#tfoot').textContent=pick(['Made with love, glue and a suspicious amount of tea.','No books were harmed. One was mildly offended.','Shh! This is a library. (Dancing is fine.)']);
  const tb=$('#tbooks');tb.innerHTML='';
  ['romance','comics','poetry','cookbook','scifi','fairy'].forEach((g,i)=>{
    const el=document.createElement('div');el.className='book happy'+(i===3&&Math.random()<.5?' legend':'');el.style.setProperty('--c',G(g).color);el.style.height=(70+(i*7)%25)+'px';
    el.style.animationDelay=(i*110)+'ms';
    el.innerHTML=(el.classList.contains('legend')?'<span class="shim"></span>':'')+'<div class="face"><span class="eye l"></span><span class="eye r"></span><span class="blush l"></span><span class="blush r"></span><span class="mouth"></span></div>';
    el.onclick=()=>{unlockAudio();SFX.babble('hello there!',g);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top,['💖','✨','🎶'],5)};
    tb.appendChild(el);
  });
  $('#title').classList.remove('hidden');
}
$('#playDaily').onclick=()=>{unlockAudio();startDaily()};
$('#playLib').onclick=()=>{unlockAudio();startLib()};
setInterval(()=>{tipI++;if(S&&S.sel==null)renderPanel()},9000);
window.addEventListener('resize',()=>{if(S)render()});

generate(libCfg(),Math.random);render();showTitle();
})();
</script>
</body>
