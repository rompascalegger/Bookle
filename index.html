<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookle</title>
<meta name="description" content="A cozy shelving puzzle. Every book has a wish. Make them all happy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4e6cf; --bg2:#ead4b4; --wall:#f9efdf; --wallLine:#efdcc1;
  --wood:#a86f43; --woodHi:#c48a58; --woodDk:#6e4426; --slot:#7a4c2d;
  --ink:#3a2a48; --muted:#7d6a72; --card:#fffaf2; --cardLine:#ecd9bd;
  --accent:#7b5cff; --accentHi:#9a82ff; --good:#ff5f8f; --bad:#e0794a;
  --sun:rgba(255,214,102,.28); --quiet:rgba(70,40,90,.16); --shadow:0 6px 18px rgba(80,50,30,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1729; --bg2:#271f37; --wall:#2a2240; --wallLine:#332a4c;
    --wood:#7b5236; --woodHi:#946545; --woodDk:#4a2f1d; --slot:#3a2618;
    --ink:#f3e9ff; --muted:#b4a6c4; --card:#2f2645; --cardLine:#43385f;
    --accent:#a58cff; --accentHi:#bfaeff; --sun:rgba(255,214,102,.14); --quiet:rgba(0,0,0,.25); --shadow:0 6px 18px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1729; --bg2:#271f37; --wall:#2a2240; --wallLine:#332a4c;
  --wood:#7b5236; --woodHi:#946545; --woodDk:#4a2f1d; --slot:#3a2618;
  --ink:#f3e9ff; --muted:#b4a6c4; --card:#2f2645; --cardLine:#43385f;
  --accent:#a58cff; --accentHi:#bfaeff; --sun:rgba(255,214,102,.14); --quiet:rgba(0,0,0,.25); --shadow:0 6px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);
  font-family:Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:10px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:30px;font-weight:700;letter-spacing:-.5px;cursor:pointer;display:flex;align-items:center;background:none;border:0;padding:0}
.logo i{margin-right:5px}
.logo span{color:var(--accent)}
.logo i{font-style:normal;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--card);border:2px solid var(--cardLine);border-radius:999px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.ib{width:36px;height:36px;border-radius:12px;border:2px solid var(--cardLine);background:var(--card);font-size:17px;display:grid;place-items:center;padding:0;transition:transform .12s}
.ib:active{transform:scale(.9)}
.ink-chip{color:var(--accent)}
.ink-chip.bump{animation:bump .4s}
.progress{position:relative;height:22px;border-radius:999px;background:var(--card);border:2px solid var(--cardLine);overflow:hidden}
#progFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff9cbc,var(--good));transition:width .4s cubic-bezier(.3,1.4,.6,1)}
#progTxt{position:relative;display:block;text-align:center;font-size:13px;font-weight:600;line-height:18px}

/* ---------- room ---------- */
.room{background:repeating-linear-gradient(90deg,var(--wall) 0 38px,var(--wallLine) 38px 40px);border-radius:20px;padding:10px 10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.room.allhappy{animation:glow 1.6s ease-in-out infinite}
.lights{display:none;position:absolute;left:0;right:0;top:0;height:16px;pointer-events:none}
.lights.on{display:flex;justify-content:space-around}
.lights b{width:7px;height:9px;border-radius:50%;margin-top:3px;animation:twinkle 1.8s infinite}
.colhead{display:grid;gap:4px;margin:6px 10px 4px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap}
.colhead span{overflow:visible}
.shelf{background:var(--woodDk);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;border:4px solid var(--wood)}
.row{display:grid;gap:4px;background:var(--slot);border-radius:6px;position:relative;box-shadow:inset 0 6px 10px rgba(0,0,0,.35)}
.row::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-6px;height:8px;background:linear-gradient(var(--woodHi),var(--wood));border-radius:3px;z-index:2}
.slot{height:var(--slotH,92px);position:relative;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.slot.sunny{background:linear-gradient(160deg,var(--sun),transparent 80%)}
.slot.quiet{background:linear-gradient(200deg,var(--quiet),transparent)}
.slot.hover{background:rgba(255,255,255,.18);outline:2px dashed rgba(255,255,255,.6);outline-offset:-3px}
.slot.target{outline:2px dashed rgba(255,255,255,.35);outline-offset:-3px}
.decor{font-size:min(32px,8vw);line-height:1;margin-bottom:4px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));cursor:pointer;transition:transform .2s}
.decor.cat{animation:catbob 3s ease-in-out infinite;transform-origin:bottom center}
.decor.lamp{filter:drop-shadow(0 0 10px rgba(255,220,120,.9))}

/* ---------- books ---------- */
.book{--c:#ccc;position:relative;width:78%;max-width:46px;height:var(--h,80%);border-radius:7px 7px 3px 3px;
  background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 22%,rgba(255,255,255,.22) 40%,transparent 60%,rgba(0,0,0,.14)),var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.3);cursor:grab;touch-action:none;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .2s;z-index:1;margin-bottom:2px}
.book::before,.book::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.45)}
.book::before{top:18%}.book::after{bottom:14%}
.book .wi{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:11px;line-height:1.05;letter-spacing:-2px;pointer-events:none}
.book .face{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:26px;height:16px;pointer-events:none}
.book .eye{position:absolute;top:0;width:5px;height:6px;background:#2b1d2e;border-radius:50%;animation:blink 4s infinite}
.book .eye.l{left:4px}.book .eye.r{right:4px}
.book .mouth{position:absolute;left:50%;top:9px;width:9px;height:5px;transform:translateX(-50%);border:2px solid #2b1d2e;border-top:0;border-radius:0 0 9px 9px}
.book.sad .mouth{top:11px;border:2px solid #2b1d2e;border-bottom:0;border-radius:9px 9px 0 0}
.book.wait .mouth{width:6px;height:2px;border:0;background:#2b1d2e;border-radius:2px;top:11px}
.book .blush{position:absolute;top:7px;width:5px;height:3px;border-radius:50%;background:rgba(255,80,120,.55);display:none}
.book.happy .blush{display:block}.book .blush.l{left:0}.book .blush.r{right:0}
.book .badge{position:absolute;top:-12px;right:-8px;font-size:15px;z-index:3;pointer-events:none;animation:pop .35s}
.book.sel{transform:translateY(-8px) rotate(-3deg);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px var(--accentHi));z-index:4}
.book.happy{animation:happyWiggle .5s}
.book.legend{background:linear-gradient(90deg,rgba(0,0,0,.15),transparent 20%,rgba(255,255,255,.55) 45%,transparent 65%),linear-gradient(160deg,#ffe58a,#f5b623 60%,#ffd75e);background-size:250% 100%,100% 100%;animation:shimmer 2.2s linear infinite}
.book.ghost{position:fixed;pointer-events:none;z-index:999;transform:rotate(6deg) scale(1.12);transition:none;width:44px;height:86px}
.book.dragging{opacity:.25}
.book.shake{animation:shake .35s}
.bubble{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--cardLine);
  border-radius:12px;padding:5px 9px;font-size:12px;font-weight:500;width:max-content;max-width:170px;z-index:20;pointer-events:none;box-shadow:var(--shadow);animation:bubble 2.2s forwards;text-align:center;line-height:1.2}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--cardLine)}

/* ---------- cart ---------- */
.cartwrap{position:relative;padding-bottom:16px}
.cart{min-height:96px;background:linear-gradient(var(--woodHi),var(--wood));border-radius:14px;border:3px solid var(--woodDk);display:flex;align-items:flex-end;
  flex-wrap:wrap;justify-content:center;gap:10px 6px;padding:14px 10px 10px;box-shadow:var(--shadow)}
.cart .book{flex:0 0 40px;height:76px}
.cart.hover{outline:3px dashed var(--accent);outline-offset:2px}
.cart .empty{margin:auto;color:#fff6e6;font-weight:600;font-size:14px;opacity:.9;text-align:center;align-self:center}
.wheel{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:#3a2a20;border:4px solid #8c6b55}
.wheel.l{left:30px}.wheel.r{right:30px}
.cartlabel{position:absolute;top:-9px;left:14px;background:var(--card);border:2px solid var(--cardLine);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px;z-index:2}

/* ---------- panel ---------- */
.panel{background:var(--card);border:2px solid var(--cardLine);border-radius:18px;padding:12px 14px;min-height:118px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.panel .pb{flex:0 0 auto;position:relative;width:44px;height:90px;display:flex;align-items:flex-end}
.panel .pb .book{width:44px;max-width:none;height:90px;cursor:default}
.panel h3{margin:0 0 2px;font-size:17px;line-height:1.15}
.panel .meta{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--bg2)}
.quote{font-size:14.5px;margin:0 0 6px;font-style:italic;line-height:1.3}
.rule{font-size:12.5px;color:var(--muted);margin:2px 0;display:flex;gap:6px;align-items:baseline}
.rule b{color:var(--ink);font-weight:600}
.rule.ok b{color:var(--good)}
.tip{font-size:14px;line-height:1.4;color:var(--muted)}
.tip strong{color:var(--ink)}
.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(60,30,140,.45);transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,30,140,.45)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--cardLine);box-shadow:0 4px 0 var(--cardLine);flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pulse{animation:pulse 1.2s infinite}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,18,40,.55);display:grid;place-items:center;z-index:500;padding:16px;animation:fade .2s}
.overlay.hidden{display:none}
.card{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .35s cubic-bezier(.3,1.5,.5,1);position:relative}
.card h2{margin:0 0 8px;font-size:24px;text-align:center}
.card p{line-height:1.45}
.card .x{position:absolute;top:10px;right:10px}
.stars{font-size:38px;text-align:center;letter-spacing:4px;margin:4px 0}
.stars span{display:inline-block;animation:starpop .5s backwards}
.sumrow{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed var(--cardLine);font-size:15px}
.sumrow b{color:var(--accent)}
.shopitem{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--cardLine);border-radius:14px;margin-bottom:8px}
.shopitem .em{font-size:30px;width:40px;text-align:center}
.shopitem .tx{flex:1;font-size:13px;color:var(--muted);line-height:1.3}
.shopitem .tx b{display:block;color:var(--ink);font-size:15px}
.shopitem .btn{flex:0 0 auto;padding:8px 12px;font-size:14px}
.shopitem.owned{opacity:.6}
.dexg{margin:10px 0 4px;font-weight:600;display:flex;justify-content:space-between}
.dexl{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.dexl div{font-size:12px;padding:5px 7px;border-radius:8px;background:var(--bg2);line-height:1.2}
.dexl div.unk{opacity:.5;letter-spacing:2px}
.share{white-space:pre;font-size:14px;background:var(--bg2);border-radius:12px;padding:10px;text-align:center;line-height:1.5;margin:8px 0}

/* title */
#title{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);background-color:var(--bg)}
#title.hidden{display:none}
.tcard{max-width:420px;width:100%;text-align:center}
.tlogo{font-size:64px;font-weight:700;letter-spacing:-2px;margin:0;line-height:1}
.tlogo span{color:var(--accent)}
.tsub{color:var(--muted);margin:6px 0 18px;font-size:16px}
.tbooks{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:100px;margin:10px 0 18px}
.tbooks .book{flex:0 0 40px;cursor:pointer}
.tbooks .book:nth-child(odd){animation:bob 2s ease-in-out infinite}
.tbooks .book:nth-child(even){animation:bob 2s ease-in-out .5s infinite}
.tbtn{display:block;width:100%;margin:10px 0;text-align:left;padding:14px 16px}
.tbtn small{display:block;font-weight:400;font-size:13px;opacity:.85}
.tfoot{margin-top:14px;font-size:13px;color:var(--muted)}

#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card);border:2px solid var(--cardLine);border-radius:14px;padding:9px 12px;font-size:14px;box-shadow:var(--shadow);animation:toast 4.2s forwards;line-height:1.3}
#fx{position:fixed;inset:0;pointer-events:none;z-index:700;overflow:hidden}
.p{position:absolute;font-size:18px;animation:fly 1s ease-out forwards}

@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes catbob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scaleY(.96)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes happyWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-6px)}50%{transform:rotate(6deg) translateY(-3px)}75%{transform:rotate(-3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes shimmer{0%{background-position:150% 0,0 0}100%{background-position:-100% 0,0 0}}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes glow{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(255,95,143,0)}50%{box-shadow:var(--shadow),0 0 0 6px rgba(255,95,143,.35)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}
@media (max-width:400px){#app{padding:8px 12px 24px}.logo{font-size:24px}.ib{width:32px;height:32px;font-size:15px}.chip{font-size:12px;padding:3px 8px}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="logo" id="homeBtn" aria-label="Home"><i>📚</i>Book<span>le</span></button>
    <div class="hud">
      <span class="chip ink-chip" id="inkLbl" title="Ink">💧 0</span>
      <button class="ib" id="dexBtn" title="Bookdex">📖</button>
      <button class="ib" id="shopBtn" title="Shop">🛍️</button>
      <button class="ib" id="sndBtn" title="Sound">🔊</button>
      <button class="ib" id="helpBtn" title="How to play">?</button>
    </div>
  </header>
  <div class="progress"><div id="progFill"></div><span id="progTxt"></span></div>
  <div class="room" id="room">
    <div class="lights" id="lights"></div>
    <div class="colhead" id="colhead"></div>
    <div class="shelf" id="shelf"></div>
  </div>
  <div class="cartwrap">
    <span class="cartlabel" id="cartLabel">📦 Returns cart</span>
    <div class="cart" id="cart"></div>
    <span class="wheel l"></span><span class="wheel r"></span>
  </div>
  <div class="panel" id="panel"></div>
  <div class="actions">
    <button class="btn sec" id="hintBtn">💡 Hint</button>
    <button class="btn" id="closeBtn">🌙 Close for the night</button>
  </div>
</div>

<div id="title">
  <div class="tcard">
    <h1 class="tlogo">Book<span>le</span></h1>
    <p class="tsub">Every book has a wish. Some are reasonable.</p>
    <div class="tbooks" id="tbooks"></div>
    <button class="btn tbtn" id="playDaily">☀️ Daily Bookle <small id="dailySub">One puzzle a day. Same for everyone.</small></button>
    <button class="btn tbtn sec" id="playLib" style="width:100%">🏛️ My Library <small id="libSub">Endless days, ink, a cat.</small></button>
    <div class="tfoot" id="tfoot"></div>
  </div>
</div>

<div class="overlay hidden" id="modal"><div class="card" id="modalCard"></div></div>
<div id="toasts"></div>
<div id="fx"></div>

<script>
(() => {
"use strict";
/* ================= data ================= */
const GENRES = {
  romance:{name:'Romance',emoji:'💕',color:'#f48fb4',blurb:'Swoons easily.',
    happy:["I'm swooning!","Be still, my spine!","It's love at first shelf."],
    sad:["My heart... it's breaking.","This is not my happily-ever-after.","How could you?! *dramatic sob*"],
    titles:["Pride and Pudding","Love in the Time of Cholesterol","Kiss Me, Librarian","The Duke Who Loved Spreadsheets","Sense and Sensitivity Training","Romeo, Juliet & Gary","Hearts on the Late Fee","Love, Actually Maybe"]},
  mystery:{name:'Mystery',emoji:'🔍',color:'#a084dc',blurb:'Suspects everyone. Including you.',
    happy:["Case closed.","Elementary, my dear librarian.","The clues all point to... perfection."],
    sad:["Something's fishy here.","I suspect foul shelving.","This placement is a crime."],
    titles:["Who Ate the Last Cookie?","The Case of the Missing Sock","Murder on the Orient Espresso","The Hound of the Basket-villes","Death by Bookmark","The Butler Did Yoga","And Then There Were Nuns","The Curious Incident of the Dog at Brunch"]},
  cookbook:{name:'Cookbook',emoji:'🍳',color:'#f7a65e',blurb:'Smells faintly of cinnamon.',
    happy:["Chef's kiss!","Mmm, perfectly seasoned.","This shelf is well-done. Like toast."],
    sad:["Overcooked placement.","This is half-baked.","Not my cup of tea. Literally."],
    titles:["The Joy of Toast","Bake Me Up Before You Go-Go","Lord of the Onion Rings","Soup, Sweet Soup","Fifty Shades of Gravy","The Grapes of Rad","Crème Brûlée & Punishment","A Tale of Two Pizzas"]},
  comics:{name:'Comics',emoji:'💥',color:'#f5cf45',blurb:'SPEAKS IN ALL CAPS.',
    happy:["KA-POW! PERFECT!","HOLY SHELVES!","EXCELSIOR-ISH!"],
    sad:["WHAT?! NO!!","THIS IS MY ORIGIN STORY OF SADNESS.","*sad onomatopoeia*"],
    titles:["Captain Snacktime","Kapow Kittens","The Incredible Sulk","Nap Man Returns","Sidekick's Day Off","Super Grandma Vol. 3","Laser Llama","The Fantastic Fourteen"]},
  poetry:{name:'Poetry',emoji:'🌙',color:'#73aaea',blurb:'Sighs. A lot.',
    happy:["A shelf... so lovely... *sigh*","Roses are red, this spot is ideal.","I shall write an ode to this."],
    sad:["Woe... this shelf...","O cruel, cruel plank.","*sighs in iambic pentameter*"],
    titles:["Sighs, Volume II","Ode to a Damp Leaf","Sonnets for Puddles","I Wandered Lonely as a Cloud Server","Haikus About Socks","Moon, Again","Rhymes with Orange (Nothing)","Deep Thoughts, Shallow Bath"]},
  scifi:{name:'Sci-Fi',emoji:'🚀',color:'#4ec4b6',blurb:'Beeps when nervous.',
    happy:["Beep boop. Joy detected.","Optimal coordinates achieved.","To infinity and this shelf!"],
    sad:["Error 404: happiness not found.","Houston, we have a shelf problem.","Beep. Boo. (sad beep)"],

function tone(f,t0,dur,type,vol,f2){
  if(!P.sound)return;const a=ac();if(!a)return;const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}

let S=null; // current puzzle

function ctx(b,idx,w){
  const r=Math.floor(idx/S.cols),c=idx%S.cols;
  return {b,w,r,c,rows:S.rows,cols:S.cols,
    L:c>0?S.grid[idx-1]:null, R:c<S.cols-1?S.grid[idx+1]:null, B:r<S.rows-1?S.grid[idx+S.cols]:null};
}
const wishOk=(b,idx,w)=>WISH[w.type].ok(ctx(b,idx,w));
const isHappy=b=>b.pos>=0&&b.wishes.every(w=>wishOk(b,b.pos,w));
// evaluate b as if it were at idx (swapping occupant into b's old spot)
function hypothetical(b,idx,fn){
  const from=b.pos, occ=S.grid[idx];
  if(from>=0)S.grid[from]=null;
  if(isB(occ)&&from>=0)S.grid[from]=occ;
  S.grid[idx]=b;
  const res=fn();
  S.grid[idx]=occ; if(from>=0)S.grid[from]=b;
  return res;
}

/* ---------- generator (solvable by construction) ---------- */
function generate(cfg,rng){
  const {rows,cols,decor,genres,n,legend,diff}=cfg;
  const total=rows*cols;
  S={rows,cols,grid:Array(total).fill(null),books:[],cart:[],moves:0,hints:0,sel:null,mode:cfg.mode,num:cfg.num,catDone:false,done:false,wasAll:false};
  const order=shuffle([...Array(total).keys()],rng);
  decor.forEach(k=>{S.grid[order.pop()]={t:'decor',kind:k}});
  const free=order;
  // books
  const used=new Set(), dex=new Set(P.dex);
  for(let i=0;i<n;i++){
    const g=pick(genres,rng);
    let pool=G(g).titles.filter(t=>!used.has(t));
    if(!pool.length)pool=G(g).titles;
    if(cfg.mode==='lib'){const fresh=pool.filter(t=>!dex.has(t));if(fresh.length&&rng()<.65)pool=fresh}
    const title=pick(pool,rng);used.add(title);
    S.books.push({t:'book',id:i,genre:g,title,wishes:[],legend:rng()<legend,h:62+Math.floor(rng()*26),pos:-1,happy:false});
  }
  // solution placement
  S.books.forEach((b,i)=>{b.pos=free[i];S.grid[free[i]]=b});
  const inPlay=[...new Set(S.books.map(b=>b.genre))];
  const freeSlots=[...Array(total).keys()].filter(i=>!(S.grid[i]&&S.grid[i].t==='decor'));
  const usedT={};
  shuffle([...S.books],rng).forEach(b=>{
    const cands=[];
    ['window','corner','top','bottom','alone','social','same'].forEach(t=>cands.push({type:t}));
    inPlay.forEach(g=>{
      if(g!==b.genre)cands.push({type:'like',g});
      const others=S.books.filter(o=>o!==b&&o.genre===g).length;
      if(others)cands.push({type:'dislike',g});
      cands.push({type:'above',g});
    });
    decor.forEach(d=>cands.push({type:'near',d}));
    if(decor.includes('cat'))cands.push({type:'nocat'});
    const sat=cands.filter(w=>wishOk(b,b.pos,w));
    const weights=sat.map(w=>{
      const home=b.pos;S.grid[home]=null;
      let cnt=0;freeSlots.forEach(j=>{if(j===home||!S.grid[j]){S.grid[j]=b;if(wishOk(b,j,w))cnt++;S.grid[j]=j===home?null:null}});
      S.grid[home]=b;
      return TYPEW[w.type]*Math.pow(1/Math.max(1,cnt),diff)/(1+(usedT[w.type]||0)*.9);
    });
    const w1=wpick(sat,weights,rng);b.wishes.push(w1);usedT[w1.type]=(usedT[w1.type]||0)+1;
    if(b.legend){
      const rest=sat.filter(w=>w.type!==w1.type),rw=rest.map(w=>weights[sat.indexOf(w)]);
      if(rest.length){const w2=wpick(rest,rw,rng);b.wishes.push(w2);usedT[w2.type]=(usedT[w2.type]||0)+1}
      else b.legend=false;
    }
    b.line=lineFor(b.wishes[0],b,rng);
    if(b.wishes[1])b.line+=' Also: '+lineFor(b.wishes[1],b,rng).replace(/^./,c=>c.toLowerCase());
  });
  S.sol={};S.books.forEach(b=>{S.sol[b.id]=b.pos;S.grid[b.pos]=null;b.pos=-1});
  S.cart=shuffle(S.books.map(b=>b.id),rng);
}
function lineFor(w,b,rng){
  const L=WISH[w.type].lines;const arr=Array.isArray(L)?L:L[w.d];
  return pick(arr,rng).replace(/\{G\}/g,w.g?G(w.g).name:'').replace(/\{S\}/g,G(b.genre).name);
}

function allHappy(){return S.books.every(b=>b.happy)}

/* ================= fx ================= */
function rectOf(id){const el=document.querySelector(`#shelf .book[data-id="${id}"],#cart .book[data-id="${id}"]`);return el?el.getBoundingClientRect():null}
function burst(x,y,emojis,n){
  const fx=$('#fx');
  for(let i=0;i<n;i++){
    const p=document.createElement('span');p.className='p';p.textContent=pick(emojis);
    const a=Math.random()*Math.PI*2,d=40+Math.random()*70;
    p.style.left=x+'px';p.style.top=y+'px';
    p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(Math.sin(a)*d-40)+'px');p.style.setProperty('--rot',(Math.random()*120-60)+'deg');
    p.style.animationDuration=(.7+Math.random()*.6)+'s';
    fx.appendChild(p);setTimeout(()=>p.remove(),1400);
  }
}
function say(id,text){
  const el=document.querySelector(`#shelf .book[data-id="${id}"],#cart .book[data-id="${id}"]`);if(!el)return;
  document.querySelectorAll('.bubble').forEach(x=>x.remove());
  const bu=document.createElement('div');bu.className='bubble';bu.textContent=text;el.appendChild(bu);setTimeout(()=>bu.remove(),2300);
}
function toast(html,ms){
  const t=document.createElement('div');t.className='toast';t.innerHTML=html;if(ms)t.style.animationDuration=ms+'ms';
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),ms||4300);
}
function bumpInk(){const el=$('#inkLbl');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

/* ================= moves ================= */
const GENERIC_HAPPY=["Ahh, perfect.","Ooh!","*happy page flutter*","This is the one.","I could live here.","10/10 shelf.","*purrs in paper*","Finally, someone who listens."];
const GENERIC_SAD=["Hmph.","Excuse me?","This is NOT what I asked for.","*passive-aggressive rustle*","I'll write a strongly-worded footnote.","Wrong. But I appreciate the effort.","Did you even read my blurb?"];
function evalAll(){const before={};S.books.forEach(b=>{before[b.id]=b.happy;b.happy=isHappy(b)});return before}
function place(id,idx){
  const b=S.books[id],cell=S.grid[idx];
  if(cell&&cell.t==='decor'){SFX.nope();if(cell.kind==='cat')toast('🐈 The cat refuses to move. It was here first.');return}
  if(b.pos===idx){S.sel=null;render();return}
  const from=b.pos;
  if(isB(cell)){
    if(from>=0){S.grid[from]=cell;cell.pos=from}
    else{cell.pos=-1;S.cart.splice(S.cart.indexOf(id),1,cell.id)}
  } else if(from<0)S.cart.splice(S.cart.indexOf(id),1);
  else S.grid[from]=null;
  S.grid[idx]=b;b.pos=idx;S.moves++;S.sel=null;
  afterMove(b,isB(cell)?cell:null);
}
function toCart(id){
  const b=S.books[id];if(b.pos<0)return;
  S.grid[b.pos]=null;b.pos=-1;S.cart.push(id);S.moves++;S.sel=null;SFX.drop();
  afterMove(null,null);
}
function afterMove(b,swapped){
  const before=evalAll();
  render();
  if(b){
    const r=rectOf(b.id);
    if(b.happy){
      SFX.happy();
      const gl=G(b.genre).happy.concat(GENERIC_HAPPY);say(b.id,pick(gl));
      if(r)burst(r.left+r.width/2,r.top,['💖','✨','💕','⭐'],b.legend?14:7);
      const el=document.querySelector(`#shelf .book[data-id="${b.id}"]`);if(el){el.classList.remove('happy');void el.offsetWidth;el.classList.add('happy')}
    } else {
      SFX.grump();say(b.id,pick(G(b.genre).sad.concat(GENERIC_SAD)));
      const el=document.querySelector(`#shelf .book[data-id="${b.id}"]`);if(el)el.classList.add('shake');
    }
  }
  // ripple reactions on neighbors whose mood changed
  let rip=0;
  S.books.forEach(o=>{
    if(o===b||o.pos<0||before[o.id]===o.happy)return;
    const r=rectOf(o.id);if(!r)return;rip++;
    if(o.happy){burst(r.left+r.width/2,r.top,['💖','✨'],4)}
    else{burst(r.left+r.width/2,r.top,['💢'],2);const el=document.querySelector(`#shelf .book[data-id="${o.id}"]`);if(el)el.classList.add('shake');if(!b||rip===1)setTimeout(()=>say(o.id,pick(["Hey! I was comfy!","Ugh, new neighbor.","Who invited THEM?","I liked it before.","Rude."])),b?700:0)}
  });
  if(rip&&b)setTimeout(SFX.ripple,180);
  checkState();
}
function checkState(){
  const all=S.cart.length===0&&allHappy();
  if(all&&!S.wasAll){
    S.wasAll=true;setTimeout(()=>{SFX.perfect();const r=$('#room').getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>burst(r.left+Math.random()*r.width,r.top+Math.random()*r.height*.8,['💖','✨','🎉','📚','⭐'],8),i*120)},250);
    if(S.mode==='daily'&&!S.done){S.done=true;setTimeout(finishDaily,1300)}
    else if(S.mode==='lib')toast('✨ <b>Everyone is happy!</b> Close for the night to collect a Perfect Day bonus.');
  } else if(!all)S.wasAll=false;
  if(S.mode==='lib'&&!S.cart.length&&!S.catDone&&owns('cat')){
    S.catDone=true;
    if(Math.random()<.55){
      setTimeout(()=>{
        const vict=S.books.filter(b=>b.pos>=0&&!b.legend);if(!vict.length)return;
        const v=pick(vict);S.grid[v.pos]=null;v.pos=-1;S.cart.push(v.id);
        SFX.meow();evalAll();S.wasAll=false;render();
        toast(`🐈 <b>The cat</b> knocked <i>${esc(v.title)}</i> off the shelf. ${pick(["It looked you dead in the eye while doing it.","Then it sat in the empty spot. Briefly.","It shows no remorse.","Classic cat."])}`);
        setTimeout(()=>say(v.id,pick(["I was MID-CHAPTER!","Unbelievable. UNBELIEVABLE.","I have fur on my cover now.","Put me back. With dignity."])),300);
      },1100);
    }
  }
}

/* ================= input ================= */
let drag=null;
function slotAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;return el.closest('.slot')||(el.closest('.cart,.cartwrap')?'cart':null)}
document.addEventListener('pointerdown',e=>{
  const bk=e.target.closest('#shelf .book,#cart .book');
  if(bk){drag={id:+bk.dataset.id,x:e.clientX,y:e.clientY,el:bk,moved:false,ghost:null,last:null};e.preventDefault();return}
  drag=null;
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){
    drag.moved=true;ac();SFX.pick();
    const b=S.books[drag.id];
    const g=bookEl(b,'cart');g.classList.add('ghost');g.style.setProperty('--h','86px');document.body.appendChild(g);drag.ghost=g;
    drag.el.classList.add('dragging');
    if(S.sel!==drag.id){S.sel=drag.id;renderPanel()}
  }
  if(drag.moved){
    drag.ghost.style.left=(e.clientX-22)+'px';drag.ghost.style.top=(e.clientY-60)+'px';
    const t=slotAt(e.clientX,e.clientY);
    if(t!==drag.last){
      document.querySelectorAll('.slot.hover,.cart.hover').forEach(x=>x.classList.remove('hover'));
      const b=S.books[drag.id];let face='wait';
      if(t&&t!=='cart'){t.classList.add('hover');const idx=+t.dataset.idx,c=S.grid[idx];
        if(!(c&&c.t==='decor'))face=hypothetical(b,idx,()=>b.wishes.every(w=>wishOk(b,idx,w)))?'happy':'sad'}
      else if(t==='cart')cartEl.classList.add('hover');
      drag.ghost.classList.remove('happy','sad','wait');drag.ghost.classList.add(face);
      drag.last=t;
    }
  }
});
document.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;
  document.querySelectorAll('.slot.hover,.cart.hover').forEach(x=>x.classList.remove('hover'));
  if(d.moved){
    d.ghost.remove();
    const t=slotAt(e.clientX,e.clientY);
    if(t==='cart'){if(S.books[d.id].pos>=0)toCart(d.id);else{S.sel=null;render()}}
    else if(t){place(d.id,+t.dataset.idx)}
    else render();
    return;
  }
  // tap
  ac();
  if(S.sel===d.id){S.sel=null}else{S.sel=d.id;SFX.pick();say(d.id,pick(["Hi!","Oh! Hello.","Me? Pick me!","*nervous rustle*","Finally, attention."]))}
  render();
  if(S.sel!=null)setTimeout(()=>say(d.id,S.books[d.id].line.length>70?S.books[d.id].line.slice(0,68)+'…':S.books[d.id].line),10);
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;render()});
shelfEl.addEventListener('click',e=>{
  const dc=e.target.closest('.decor');
  if(dc){
    const r=dc.getBoundingClientRect();
    if(dc.dataset.decor==='cat'){SFX.purr();burst(r.left+r.width/2,r.top,['💗','💤','🐾'],6);
      if(S.mode==='lib'&&!S.petted){S.petted=true;P.ink+=1;saveP();renderHud();bumpInk();toast('🐈 Purrrr. The cat gives you 1 💧 (it found it under the sofa).')}
      else toast(pick(['🐈 Purrrrr.','🐈 The cat allows this.','🐈 *slow blink*','🐈 Mrrp?','🐈 The cat is judging your shelving. Lovingly.']),2200)}
    else if(dc.dataset.decor==='teacup'){tone(1400,0,.15,'sine',.05);toast(pick(['🍵 Still warm. Somehow always warm.','🍵 The tea is chamomile. The tea is always chamomile.','🍵 Please do not spill on the Cookbooks.']),2200)}
    else if(dc.dataset.decor==='lamp'){tone(900,0,.05,'square',.04);dc.style.filter=dc.style.filter?'':'grayscale(1) brightness(.6)';setTimeout(()=>dc.style.filter='',600)}
    else if(dc.dataset.decor==='fern'){toast(pick(['🪴 The fern rustles approvingly.','🪴 The fern is thriving. Unlike your houseplants.','🪴 Its name is Gerald.']),2200)}
    return;
  }
  const slot=e.target.closest('.slot');
  if(slot&&S.sel!=null&&!e.target.closest('.book')){const c=S.grid[+slot.dataset.idx];if(!c)place(S.sel,+slot.dataset.idx)}
});
$('.cartwrap').addEventListener('click',e=>{if(e.target.closest('.book'))return;if(S.sel!=null&&S.books[S.sel].pos>=0)toCart(S.sel)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(S&&S.sel!=null){S.sel=null;render()}}});

/* ================= hints ================= */
$('#hintBtn').addEventListener('click',()=>{
  if(S.done)return;
  if(S.mode==='lib'){if(P.ink<5){SFX.nope();toast('💧 Not enough ink for a hint. The books suggest… reading them.');return}}
  // choose a book not at its solution
  let cands=S.books.filter(b=>!b.happy&&b.pos!==S.sol[b.id]);
  if(!cands.length)cands=S.books.filter(b=>b.pos!==S.sol[b.id]);
  if(!cands.length){toast('💡 Everything is already where it should be!');return}
  cands.sort((a,b)=>(a.pos<0?0:1)-(b.pos<0?0:1));
  const b=cands[0],target=S.sol[b.id],occ=S.grid[target];
  if(S.mode==='lib'){P.ink-=5;saveP()}
  S.hints++;
  // move occupant to cart first, so the swap is clean
  if(isB(occ)&&occ!==b){S.grid[target]=null;occ.pos=-1;S.cart.push(occ.id)}
  place(b.id,target);S.moves--; // hints don't count as moves
  renderHud();
  toast(`💡 <i>${esc(b.title)}</i> whispers: "${pick(["I belong here. Trust me.","This spot. It's destiny.","Psst. Here."])}"`,2600);
});

/* ================= day flow ================= */
function startLib(){
  const rng=Math.random;
  generate(libCfg(),rng);S.petted=false;
  $('#title').classList.add('hidden');render();
  const r=S.books[0];
  setTimeout(()=>toast(`📬 <i>${esc(pick(S.books).title)}</i> was returned ${pick(['3 weeks','11 days','a fortnight','6 months','one (1) leap year'])} late. Excuse: "${pick(EXCUSES)}"`,5200),500);
  const nG=Math.min(8,4+Math.floor((P.day-1)/2));
  if(P.day>1&&(P.day-1)%2===0&&nG<=8&&nG>4&&!P['g'+nG]){P['g'+nG]=1;saveP();const g=G(GENRE_ORDER[nG-1]);setTimeout(()=>toast(`🎉 <b>New genre in town:</b> ${g.emoji} ${g.name}! ${g.blurb}`,5200),1600)}
  if(!P.help){P.help=true;saveP();setTimeout(showHelp,300)}
}
function closeDay(){
  if(S.mode!=='lib'||S.cart.length)return;
  const happy=S.books.filter(b=>b.happy),n=S.books.length,perfect=happy.length===n;
  const mult=(owns('bookmark')?1.5:1)*(owns('lights')?1.15:1);
  const base=happy.length*2, leg=happy.filter(b=>b.legend).length*10;
  const streakNext=perfect?P.streak+1:0;
  const bonus=perfect?Math.min(40,8+P.streak*4):0;
  const total=Math.round((base+leg+bonus)*mult);
  const newDex=happy.filter(b=>!P.dex.includes(b.title));
  newDex.forEach(b=>P.dex.push(b.title));
  P.ink+=total;P.happyTotal+=happy.length;P.streak=streakNext;P.best=Math.max(P.best,P.streak);if(perfect)P.perfects++;
  const pct=happy.length/n,stars=perfect?3:pct>=.75?2:pct>=.5?1:0;
  const dayWas=P.day;P.day++;saveP();
  SFX.coin();
  const grumps=S.books.filter(b=>!b.happy);
  openModal(`<h2>🌙 Day ${dayWas} complete</h2>
    <div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${i*.18}s;${i<stars?'':'filter:grayscale(1);opacity:.35'}">⭐</span>`).join('')}</div>
    <p style="text-align:center;margin:4px 0 12px">${perfect?pick(['A perfect day! The books are writing you a thank-you note.','Flawless. Several books cried. Happily.','Perfect! Even the Encyclopedia said "acceptable".']):grumps.length===1?`Almost! <i>${esc(grumps[0].title)}</i> is sulking. It'll get over it.`:`${grumps.length} books went to sleep grumpy. They'll be fine. Probably.`}</p>
    <div class="sumrow"><span>💖 Happy books (${happy.length}×2)</span><b>+${base}</b></div>
    ${leg?`<div class="sumrow"><span>🌟 Legendary bonus</span><b>+${leg}</b></div>`:''}
    ${perfect?`<div class="sumrow"><span>✨ Perfect Day${P.streak>1?` (streak ${P.streak})`:''}</span><b>+${bonus}</b></div>`:''}
    ${mult>1?`<div class="sumrow"><span>🔖 Ink multiplier</span><b>×${mult.toFixed(2).replace(/0$/,'')}</b></div>`:''}
    <div class="sumrow" style="font-size:17px"><span><b style="color:var(--ink)">Total</b></span><b>+${total} 💧</b></div>
    ${newDex.length?`<p style="margin:12px 0 0">📖 <b>${newDex.length} new</b> in your Bookdex! (${P.dex.length}/${ALL_TITLES})</p>`:''}
    ${P.streak>=2?`<p style="margin:6px 0 0">🔥 Perfect streak: <b>${P.streak}</b>. Don't break it!</p>`:(!perfect&&P.best>=2?`<p style="margin:6px 0 0;color:var(--muted)">Streak reset. Best: ${P.best} 🔥</p>`:'')}
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn sec" id="mShop">🛍️ Shop</button><button class="btn" id="mNext">☀️ Open Day ${P.day}</button></div>`,false);
  $('#mNext').onclick=()=>{closeModal();startLib()};
  $('#mShop').onclick=()=>{openShop(true)};
}
$('#closeBtn').addEventListener('click',()=>{if(S.mode==='lib')closeDay();else if(S.done)showDailyResult()});

/* ---------- daily ---------- */
function startDaily(){
  const num=dailyNum();
  generate(dailyCfg(num),mulberry32(num*7919+1234567));
  $('#title').classList.add('hidden');render();
  if(D.res[num]){S.replay=true;toast('☀️ You already solved today\'s Bookle. This is a practice replay!',3500)}
  if(!P.help){P.help=true;saveP();setTimeout(showHelp,300)}
}
function rankFor(moves,n,hints){
  if(hints===0&&moves<=n)return '🏆 Mind-Reader';
  if(hints===0&&moves<=n+4)return '🎩 Head Librarian';
  if(moves<=n+10&&hints<=1)return '📖 Bookworm';
  return '🐛 Enthusiastic Intern';
}
function finishDaily(){
  const num=S.num;
  if(!D.res[num]){
    D.res[num]={m:S.moves,h:S.hints,n:S.books.length};
    D.streak=(D.last===num-1)?D.streak+1:1;D.last=num;D.best=Math.max(D.best,D.streak);D.played++;saveD();
    S.books.forEach(b=>{if(!P.dex.includes(b.title))P.dex.push(b.title)});saveP();
  }
  render();showDailyResult();
}
function shareText(num){
  const r=D.res[num];if(!r)return '';
  const hearts='💖'.repeat(r.n);
  return `Bookle #${num} 📚\n${hearts}\n${r.n}/${r.n} happy · ${r.m} moves · ${r.h} hint${r.h===1?'':'s'}\n${rankFor(r.m,r.n,r.h)}`;
}
function showDailyResult(){
  const num=S.num,r=D.res[num];if(!r)return;
  const st=shareText(num);
  openModal(`<h2>☀️ Daily Bookle #${num}</h2>
    <p style="text-align:center;margin:0 0 6px">${pick(['Every single book is happy. You are a menace to grumpiness.','The books have formed a fan club. You are the president.','Shelved to perfection. The cat is impressed (it will never say so).'])}</p>
    <div class="share">${esc(st)}</div>
    <div class="sumrow"><span>🔥 Daily streak</span><b>${D.streak}</b></div>
    <div class="sumrow"><span>🏅 Best streak</span><b>${D.best}</b></div>
    <div class="sumrow"><span>📅 Played</span><b>${D.played}</b></div>
    <p style="text-align:center;color:var(--muted);font-size:14px" id="cd"></p>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sec" id="mLib">🏛️ My Library</button><button class="btn" id="mShare">📤 Copy result</button></div>`);
  const cd=$('#cd');const tick=()=>{if(!document.body.contains(cd))return;const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n;const h=Math.floor(t/36e5),m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60;cd.textContent=`Next Bookle in ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;setTimeout(tick,1000)};tick();
  $('#mShare').onclick=()=>copy(st);
  $('#mLib').onclick=()=>{closeModal();startLib()};
}
function copy(t){
  const done=()=>toast('📋 Copied! Go make your friends jealous.',2500);
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({text:t}).catch(()=>{});return}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
}

function openShop(fromSummary){
  const items=SHOP.map(it=>{
    const own=owns(it.id),locked=it.req&&!owns(it.req);
    return `<div class="shopitem ${own?'owned':''}"><div class="em">${it.emoji}</div><div class="tx"><b>${it.name}</b>${it.desc}</div>
      ${own?'<span class="tag">Owned ✓</span>':locked?'<span class="tag">🔒</span>':`<button class="btn" data-buy="${it.id}" ${P.ink<it.cost?'disabled':''}>${it.cost} 💧</button>`}</div>`}).join('');
  openModal(`<h2>🛍️ Cozy Shop</h2><p style="text-align:center;margin:0 0 12px">You have <b style="color:var(--accent)">${P.ink} 💧</b> ink.${fromSummary?' New items show up from your next day on.':''}</p>${items}
    ${fromSummary?`<button class="btn" style="width:100%;margin-top:6px" id="mNext2">☀️ Open Day ${P.day}</button>`:''}`,!fromSummary);
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.buy);if(P.ink<it.cost)return;

    const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,[it.emoji,'✨','💖'],10);
    toast(`${it.emoji} <b>${it.name}</b> ${pick(['delivered! The books are gossiping about it.','acquired! Very cozy.','is here! Everyone pretends not to be excited.'])}${S.mode==='lib'&&!fromSummary?' (Arrives tomorrow.)':''}`);
    setTimeout(()=>openShop(fromSummary),250);
  });
  if(fromSummary)$('#mNext2').onclick=()=>{closeModal();startLib()};
}
function openDex(){
  const has=new Set(P.dex);
  const html=GENRE_ORDER.map(g=>{const gg=G(g);const n=gg.titles.filter(t=>has.has(t)).length;
    return `<div class="dexg"><span>${gg.emoji} ${gg.name}</span><span style="color:var(--muted)">${n}/${gg.titles.length}${n===gg.titles.length?' 🏆':''}</span></div>
    <div class="dexl">${gg.titles.map(t=>has.has(t)?`<div style="background:${gg.color}40">${esc(t)}</div>`:'<div class="unk">???</div>').join('')}</div>`}).join('');
  openModal(`<h2>📖 Bookdex</h2><p style="text-align:center;margin:0">${P.dex.length} / ${ALL_TITLES} books made happy</p>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin:4px 0 0">Library: day ${P.day} · ${P.perfects} perfect days · best streak ${P.best}🔥</p>${html}`);
}
$('#helpBtn').onclick=showHelp;
$('#dexBtn').onclick=openDex;
$('#shopBtn').onclick=()=>openShop(false);
$('#sndBtn').onclick=()=>{P.sound=!P.sound;saveP();renderHud();if(P.sound)SFX.pick()};
$('#homeBtn').onclick=showTitle;

/* ================= title ================= */
function showTitle(){
  closeModal();
  const num=dailyNum();
  $('#dailySub').textContent=D.res[num]?`#${num} solved ✓ · streak ${D.streak}🔥 · tap to see result`:`#${num} · One puzzle a day. Same for everyone.`;
  $('#libSub').textContent=P.day>1?`Day ${P.day} · ${P.ink} 💧 · ${P.dex.length}/${ALL_TITLES} books collected`:'Endless days, ink, cozy upgrades, a cat.';
  $('#tfoot').textContent=pick(['Made with love, glue and a suspicious amount of tea.','No books were harmed. One was mildly offended.','Shh! This is a library. (Sound is fine.)']);
  const tb=$('#tbooks');tb.innerHTML='';
  ['romance','comics','poetry','cookbook','scifi','fairy'].forEach((g,i)=>{
    const fake={t:'book',id:900+i,genre:g,wishes:[],legend:i===3&&Math.random()<.5,h:70+(i*7)%25,pos:0,happy:true};
    const el=document.createElement('div');el.className='book happy'+(fake.legend?' legend':'');el.style.setProperty('--c',G(g).color);el.style.height=fake.h+'px';
    el.innerHTML='<div class="face"><span class="eye l"></span><span class="eye r"></span><span class="blush l"></span><span class="blush r"></span><span class="mouth"></span></div>';
    el.onclick=()=>{ac();tone(500+i*120,0,.15,'sine',.1);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top,['💖','✨'],5)};
    tb.appendChild(el);
  });
  $('#title').classList.remove('hidden');
}
$('#playDaily').onclick=()=>{ac();startDaily()};
$('#playLib').onclick=()=>{ac();startLib()};
setInterval(()=>{tipI++;if(S&&S.sel==null)renderPanel()},9000);
window.addEventListener('resize',()=>{if(S)render()});

// boot: render a placeholder puzzle behind the title
generate(libCfg(),Math.random);render();showTitle();
})();
</script>
